name: mvp-c-realistic-invoice-v1
on:
  push:
    branches: [harvest/mvp-c-realistic-invoice-v1]
  pull_request:
    branches: [main]
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Execute realistic synthetic invoice
        shell: bash
        run: |
          set -euo pipefail
          cd harvest/mvp-c-realistic-invoice-v1
          node --test invoice.test.mjs 2>&1 | tee /tmp/invoice.log
          sha256sum /tmp/invoice.log | sed 's/^/RESULT_SHA256=/'
      - name: Cleanup
        if: always()
        run: |
          rm -f /tmp/invoice.log
          echo CLEANUP=PASS
