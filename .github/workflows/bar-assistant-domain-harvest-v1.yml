name: bar-assistant-domain-harvest-v1
on:
  push:
    branches: [harvest/bar-assistant-domain-primitives-v1]
  pull_request:
    branches: [main]
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify bounded primitives
        shell: bash
        run: |
          set -euo pipefail
          cd harvest/bar-assistant-domain-v1
          node --version
          npm test 2>&1 | tee /tmp/harvest-test.log
          sha256sum /tmp/harvest-test.log | sed 's/^/RESULT_SHA256=/'
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f /tmp/harvest-test.log
          echo CLEANUP=PASS
