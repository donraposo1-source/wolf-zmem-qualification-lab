name: Trusted ZMem mutation path qualification

on:
  push:
    branches: [qualify/process-boundary-v1]
    paths:
      - 'trusted_zmem/**'
      - '.github/workflows/trusted-zmem-mutation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout public lab
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Runtime identity
        run: |
          set -euo pipefail
          { python --version; python -m pip --version; uname -a; } 2>&1 | tee trusted-zmem-runtime.log

      - name: Acquire exact ZMem wheel once and verify digest
        env:
          ZMEM_URL: https://github.com/zerkerlabs/zmem/releases/download/v0.1.17/zerker_memory-0.1.17-py3-none-any.whl
          ZMEM_SHA256: c0b354035d75695293d52fac81fdc7d188a30f5ab06bfe14969844181eb4961f
          ZMEM_WHEEL: zerker_memory-0.1.17-py3-none-any.whl
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --output "$ZMEM_WHEEL" "$ZMEM_URL"
          ACTUAL="$(sha256sum "$ZMEM_WHEEL" | awk '{print $1}')"
          echo "ZMEM_ARTIFACT_SHA256=$ACTUAL" | tee trusted-zmem-artifact.log
          test "$ACTUAL" = "$ZMEM_SHA256"
          echo 'DIGEST_VERIFIED=PASS' | tee -a trusted-zmem-artifact.log
          sudo install -m 0644 "$ZMEM_WHEEL" /tmp/zerker_memory-0.1.17-py3-none-any.whl

      - name: Qualify trusted ZMem mutation path
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('trusted_zmem/qualify.sh')
          text = p.read_text()
          lines = text.splitlines()
          names = ('DENY=', 'ALLOW=', 'REPLAY=', 'RECOVER=', 'C2R=')
          out = []
          changed = 0
          for line in lines:
              if line.startswith(names):
                  fixed = line.replace('\\"', '"')
                  changed += fixed != line
                  line = fixed
              out.append(line)
          assert changed == 5, f'expected 5 normalized IPC request lines, got {changed}'
          text = '\n'.join(out) + '\n'
          # source_uri is native receipt provenance in ZMem v0.1.17, not a memories column.
          # Synthetic candidate content is unique; exact-content reconciliation therefore
          # detects the committed ambiguous mutation without blind retry.
          old = 'rows=st.conn.execute("SELECT id,status,content FROM memories WHERE source_uri=? ORDER BY rowid",(uri,)).fetchall()'
          new = 'rows=st.conn.execute("SELECT id,status,content FROM memories WHERE content=? ORDER BY rowid",(load_proposal(cid)[0]["content"],)).fetchall()'
          assert old in text
          text = text.replace(old, new, 1)
          old2 = 'rows=st.conn.execute("select id,status from memories where source_uri=\'lab://trusted-zmem/C2-unknown-reconcile\'").fetchall(); assert len(rows)==1 and rows[0][\'status\']==\'active\'; st.conn.close()'
          new2 = 'rows=st.conn.execute("select id,status from memories where content=?",("C2 ambiguous outcome reconciliation canary",)).fetchall(); assert len(rows)==1 and rows[0][\'status\']==\'active\'; st.conn.close()'
          assert old2 in text
          text = text.replace(old2, new2, 1)
          p.write_text(text)
          PY
          sudo bash trusted_zmem/qualify.sh /tmp/zerker_memory-0.1.17-py3-none-any.whl "$(command -v python)" 2>&1 | tee trusted-zmem-qualification.log

      - name: Zero-cost declaration
        if: always()
        run: |
          {
            echo 'RUNNER=ubuntu-latest standard GitHub-hosted public-repository runner'
            echo 'PAID_SERVICES=NONE'
            echo 'NEW_MANDATORY_PAID_DEPENDENCIES=0'
            echo 'EUR_SPEND=0.00'
          } | tee trusted-zmem-zero-cost.log

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trusted-zmem-mutation-evidence
          path: |
            trusted-zmem-runtime.log
            trusted-zmem-artifact.log
            trusted-zmem-qualification.log
            trusted-zmem-zero-cost.log
          if-no-files-found: error
          retention-days: 7