name: WOLF Cloud Heavy Worker V1

on:
  workflow_dispatch:
    inputs:
      mission_id:
        description: PUBLIC_SAFE mission identifier
        required: true
        type: string
      runner_ref:
        description: Immutable allowlisted runner commit
        required: true
        type: string
      runner_path:
        description: Allowlisted runner path
        required: true
        type: string
permissions: {}

concurrency:
  group: wolf-cloud-heavy-worker-v1-${{ inputs.mission_id }}
  cancel-in-progress: false

jobs:
  public-safe-heavy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate dispatch inputs
        shell: bash
        env:
          MISSION_ID: ${{ inputs.mission_id }}
          INPUT_RUNNER_REF: ${{ inputs.runner_ref }}
          INPUT_RUNNER_PATH: ${{ inputs.runner_path }}
        run: |
          set -euo pipefail
          [[ "$MISSION_ID" =~ ^[A-Za-z0-9._-]{1,96}$ ]] || exit 64
          test "$INPUT_RUNNER_REF" = "1427167affb7b853ed17189ccecd4435e2c58953" || exit 64
          test "$INPUT_RUNNER_PATH" = "cloud_worker/public_safe_synthetic_v1.py" || exit 64
          echo "MISSION_ID=$MISSION_ID"
          echo "DATA_CLASS=PUBLIC_SAFE"
          echo "EUR_SPEND=0"

      - name: Fetch immutable allowlisted runner
        shell: bash
        env:
          RUNNER_REF: 1427167affb7b853ed17189ccecd4435e2c58953
          RUNNER_PATH: cloud_worker/public_safe_synthetic_v1.py
        run: |
          set -euo pipefail
          case "$RUNNER_PATH" in
            cloud_worker/public_safe_synthetic_v1.py) ;;
            *) echo "RUNNER_PATH_DENIED"; exit 64 ;;
          esac
          url="https://raw.githubusercontent.com/donraposo1-source/wolf-zmem-qualification-lab/$RUNNER_REF/$RUNNER_PATH"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 "$url" -o /tmp/wolf-cloud-runner.py
          echo "CLOUD_WORKER_STARTED=YES"
          echo "RUNNER_IDENTITY=github-hosted/ubuntu-latest"
          echo "RUNNER_REF=$RUNNER_REF"
          echo "RUNNER_PATH=$RUNNER_PATH"
          sha256sum /tmp/wolf-cloud-runner.py | sed 's/^/RUNNER_SHA256=/'

      - name: Execute PUBLIC_SAFE synthetic heavy workload
        shell: bash
        env:
          RUNNER_REF: 1427167affb7b853ed17189ccecd4435e2c58953
          RUNNER_PATH: cloud_worker/public_safe_synthetic_v1.py
        run: |
          set -euo pipefail
          test -z "${WOLF_PRIVATE_DATA:-}"
          start="$(date +%s)"
          python3 /tmp/wolf-cloud-runner.py | tee /tmp/wolf-cloud-result.json
          python3 - <<'PY'
          import json
          p="/tmp/wolf-cloud-result.json"
          d=json.load(open(p))
          assert d["schema"]=="wolf-cloud-worker-v1"
          assert d["class"]=="PUBLIC_SAFE"
          assert d["exit_code"]==0
          assert d["eur_spend"]=="0"
          assert d["final_status"]=="DONE"
          print("INPUT_SHA256="+d["input_sha256"])
          print("OUTPUT_SHA256="+d["output_sha256"])
          print("WORKLOAD_DURATION_MS="+str(d["duration_ms"]))
          print("EXIT_CODE=0")
          print("EUR_SPEND=0")
          print("FINAL_STATUS=DONE")
          PY
          end="$(date +%s)"
          echo "JOB_WALL_SECONDS=$((end-start))"

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f /tmp/wolf-cloud-runner.py /tmp/wolf-cloud-result.json
          test ! -e /tmp/wolf-cloud-runner.py
          test ! -e /tmp/wolf-cloud-result.json
          echo "CLEANUP=PASS"
